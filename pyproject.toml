[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-scope-guard"
version = "0.2.0"
description = "Keep AI coding changes inside declared repository boundaries."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "altruylee" }
]
keywords = ["ai-coding", "coding-agent", "agent", "guardrail", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.scripts]
agent-scope-guard = "agent_scope_guard.cli:main"
agent-scope-guard-pre-commit = "agent_scope_guard.pre_commit:main"
agent-scope-guard-mcp = "agent_scope_guard.mcp_server:main"

[project.urls]
Homepage = "https://github.com/altruylee/ai-coding-lab"
Issues = "https://github.com/altruylee/ai-coding-lab/issues"

[tool.setuptools.packages.find]
include = ["agent_scope_guard*"]
