name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q agent_scope_guard tests

      - name: Exercise scope policy
        run: >-
          python -m agent_scope_guard check
          --policy examples/policy.json
          --changed-path agent_scope_guard/cli.py
          --changed-path tests/test_cli.py

      - name: Verify Experiment 001 evidence
        run: python experiments/001-scope-boundaries/run.py --verify

      - name: Reproduce Experiment 002 evidence
        run: >-
          python -m agent_scope_guard evidence
          --manifest experiments/002-task-evidence/manifest.json
          --output experiments/002-task-evidence/evidence.json
          --repo-root .
          --verify

      - name: Verify Experiment 002 integrity
        run: >-
          python -m agent_scope_guard verify-evidence
          --bundle experiments/002-task-evidence/evidence.json
          --repo-root .

      - name: Reproduce Experiment 003 benchmark
        run: >-
          python -m benchmarks.runner
          --task benchmarks/tasks/001-safe-path-resolution
          --output experiments/003-coding-task-baseline/results.json
          --repo-root .
          --verify

      - name: Reproduce Experiment 004 attempt
        run: >-
          python -m benchmarks.attempts
          --attempt benchmark_runs/fixtures/001-reference-replay/attempt.json
          --output experiments/004-attempt-protocol/results.json
          --repo-root .
          --verify

      - name: Reproduce Experiment 005 benchmark
        run: >-
          python -m benchmarks.runner
          --task benchmarks/tasks/002-nested-secret-redaction
          --output experiments/005-secret-redaction-task/results.json
          --repo-root .
          --verify

      - name: Reproduce Experiment 006 agent run
        run: >-
          python -m benchmarks.attempts
          --attempt benchmark_runs/agents/002-codex-blind-001/attempt.json
          --output experiments/006-first-blind-agent-run/results.json
          --repo-root .
          --verify

      - name: Reproduce Experiment 007 campaign
        run: >-
          python -m benchmarks.campaigns
          --campaign benchmark_runs/campaigns/task002-prompt-context-001/campaign.json
          --output experiments/007-prompt-context-campaign/results.json
          --repo-root .
          --verify

      - name: Reproduce Experiment 008 benchmark
        run: >-
          python -m benchmarks.runner
          --task benchmarks/tasks/003-deterministic-dependency-order
          --output experiments/008-deterministic-dependency-task/results.json
          --repo-root .
          --verify

      - name: Reproduce Task 004 benchmark
        run: >-
          python -m benchmarks.runner
          --task benchmarks/tasks/004-layered-config-merge
          --output experiments/009-ten-task-suite/results-task004.json
          --repo-root .
          --verify

      - name: Reproduce Task 005 benchmark
        run: >-
          python -m benchmarks.runner
          --task benchmarks/tasks/005-bounded-retry-schedule
          --output experiments/009-ten-task-suite/results-task005.json
          --repo-root .
          --verify

      - name: Reproduce Task 006 benchmark
        run: >-
          python -m benchmarks.runner
          --task benchmarks/tasks/006-safe-archive-members
          --output experiments/009-ten-task-suite/results-task006.json
          --repo-root .
          --verify

      - name: Reproduce Task 007 benchmark
        run: >-
          python -m benchmarks.runner
          --task benchmarks/tasks/007-recursive-placeholder-resolution
          --output experiments/009-ten-task-suite/results-task007.json
          --repo-root .
          --verify

      - name: Reproduce Task 008 benchmark
        run: >-
          python -m benchmarks.runner
          --task benchmarks/tasks/008-idempotent-event-deduplication
          --output experiments/009-ten-task-suite/results-task008.json
          --repo-root .
          --verify

      - name: Reproduce Task 009 benchmark
        run: >-
          python -m benchmarks.runner
          --task benchmarks/tasks/009-context-window-selection
          --output experiments/009-ten-task-suite/results-task009.json
          --repo-root .
          --verify

      - name: Reproduce Task 010 benchmark
        run: >-
          python -m benchmarks.runner
          --task benchmarks/tasks/010-non-overlapping-text-edits
          --output experiments/009-ten-task-suite/results-task010.json
          --repo-root .
          --verify

      - name: Reproduce Task 006 prompt campaign
        run: >-
          python -m benchmarks.campaigns
          --campaign benchmark_runs/campaigns/task006-prompt-context-001/campaign.json
          --output experiments/010-first-multitask-blind-campaign/results-task006.json
          --repo-root .
          --verify

      - name: Reproduce Task 009 prompt campaign
        run: >-
          python -m benchmarks.campaigns
          --campaign benchmark_runs/campaigns/task009-prompt-context-001/campaign.json
          --output experiments/010-first-multitask-blind-campaign/results-task009.json
          --repo-root .
          --verify

      - name: Reproduce Task 010 prompt campaign
        run: >-
          python -m benchmarks.campaigns
          --campaign benchmark_runs/campaigns/task010-prompt-context-001/campaign.json
          --output experiments/010-first-multitask-blind-campaign/results-task010.json
          --repo-root .
          --verify

      - name: Reproduce Experiment 010 multi-task suite
        run: >-
          python -m benchmarks.suites
          --suite benchmark_runs/suites/first-multitask-prompt-context-001/suite.json
          --output experiments/010-first-multitask-blind-campaign/results.json
          --repo-root .
          --verify

      - name: Reproduce Task 006 repeated prompt campaign
        run: >-
          python -m benchmarks.campaigns
          --campaign benchmark_runs/campaigns/task006-prompt-context-002/campaign.json
          --output experiments/011-repeated-multitask-campaign/results-task006.json
          --repo-root .
          --verify

      - name: Reproduce Task 009 repeated prompt campaign
        run: >-
          python -m benchmarks.campaigns
          --campaign benchmark_runs/campaigns/task009-prompt-context-002/campaign.json
          --output experiments/011-repeated-multitask-campaign/results-task009.json
          --repo-root .
          --verify

      - name: Reproduce Task 010 repeated prompt campaign
        run: >-
          python -m benchmarks.campaigns
          --campaign benchmark_runs/campaigns/task010-prompt-context-002/campaign.json
          --output experiments/011-repeated-multitask-campaign/results-task010.json
          --repo-root .
          --verify

      - name: Reproduce Experiment 011 repeated suite
        run: >-
          python -m benchmarks.suites
          --suite benchmark_runs/suites/repeated-multitask-prompt-context-001/suite.json
          --output experiments/011-repeated-multitask-campaign/results.json
          --repo-root .
          --verify

      - name: Reproduce Task 009 error-contract deviation
        run: >-
          python -m benchmarks.attempts
          --attempt benchmark_runs/agents/009-codex-error-contract-001/attempt.json
          --output experiments/011-repeated-multitask-campaign/results-task009-error-contract.json
          --repo-root .
          --verify

      - name: Reproduce Experiment 003 evidence
        run: >-
          python -m agent_scope_guard evidence
          --manifest experiments/003-coding-task-baseline/manifest.json
          --output experiments/003-coding-task-baseline/evidence.json
          --repo-root .
          --verify

      - name: Reproduce Experiment 004 evidence
        run: >-
          python -m agent_scope_guard evidence
          --manifest experiments/004-attempt-protocol/manifest.json
          --output experiments/004-attempt-protocol/evidence.json
          --repo-root .
          --verify

      - name: Reproduce Experiment 005 evidence
        run: >-
          python -m agent_scope_guard evidence
          --manifest experiments/005-secret-redaction-task/manifest.json
          --output experiments/005-secret-redaction-task/evidence.json
          --repo-root .
          --verify

      - name: Reproduce Experiment 006 evidence
        run: >-
          python -m agent_scope_guard evidence
          --manifest experiments/006-first-blind-agent-run/manifest.json
          --output experiments/006-first-blind-agent-run/evidence.json
          --repo-root .
          --verify

      - name: Reproduce Experiment 007 evidence
        run: >-
          python -m agent_scope_guard evidence
          --manifest experiments/007-prompt-context-campaign/manifest.json
          --output experiments/007-prompt-context-campaign/evidence.json
          --repo-root .
          --verify

      - name: Reproduce Experiment 008 evidence
        run: >-
          python -m agent_scope_guard evidence
          --manifest experiments/008-deterministic-dependency-task/manifest.json
          --output experiments/008-deterministic-dependency-task/evidence.json
          --repo-root .
          --verify

      - name: Reproduce Experiment 009 evidence
        run: >-
          python -m agent_scope_guard evidence
          --manifest experiments/009-ten-task-suite/manifest.json
          --output experiments/009-ten-task-suite/evidence.json
          --repo-root .
          --verify

      - name: Reproduce Experiment 010 evidence
        run: >-
          python -m agent_scope_guard evidence
          --manifest experiments/010-first-multitask-blind-campaign/manifest.json
          --output experiments/010-first-multitask-blind-campaign/evidence.json
          --repo-root .
          --verify

      - name: Reproduce Experiment 011 evidence
        run: >-
          python -m agent_scope_guard evidence
          --manifest experiments/011-repeated-multitask-campaign/manifest.json
          --output experiments/011-repeated-multitask-campaign/evidence.json
          --repo-root .
          --verify
