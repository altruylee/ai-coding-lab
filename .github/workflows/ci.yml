name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q agent_scope_guard tests

      - name: Exercise scope policy
        run: >-
          python -m agent_scope_guard check
          --policy examples/policy.json
          --changed-path agent_scope_guard/cli.py
          --changed-path tests/test_cli.py

      - name: Verify Experiment 001 evidence
        run: python experiments/001-scope-boundaries/run.py --verify

      - name: Reproduce Experiment 002 evidence
        run: >-
          python -m agent_scope_guard evidence
          --manifest experiments/002-task-evidence/manifest.json
          --output experiments/002-task-evidence/evidence.json
          --repo-root .
          --verify

      - name: Verify Experiment 002 integrity
        run: >-
          python -m agent_scope_guard verify-evidence
          --bundle experiments/002-task-evidence/evidence.json
          --repo-root .
